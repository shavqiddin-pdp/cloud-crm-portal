services:
  app1:
    build: ./app
    environment:
      SERVER_NAME: app1
  app2:
    build: ./app
    environment:
      SERVER_NAME: app2
  app3:
    build: ./app
    environment:
       SERVER_NAME: app3
  app4:
    build: ./app
    environment:
      SERVER_NAME: app4

  nginx:
    image: nginx:latest
    container_name: nginx_lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
      - app4
